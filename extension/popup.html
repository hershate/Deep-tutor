<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 300px; font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; color: #1e293b; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    button { display: block; width: 100%; margin: 6px 0; padding: 7px 0; border: 1px solid #cbd5e1;
             border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin: 8px 0; min-height: 18px; font-size: 12px; }
    #status.ok { color: #16a34a; } #status.err { color: #dc2626; }
    #last { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b; }
    #last a { color: #2563eb; }
    #last .time { color: #94a3b8; font-size: 11px; margin-bottom: 2px; }
    #last .err { color: #dc2626; }
    #options-link { display: block; margin-top: 8px; text-align: center; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Deep-tutor 剪藏</h1>
  <button id="clip-selection" class="primary">剪藏选中内容</button>
  <button id="clip-page">剪藏本页链接</button>
  <div id="status" role="status"></div>
  <div id="last" hidden></div>
  <a id="options-link" href="#">设置服务器 / Token</a>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
