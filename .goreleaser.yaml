version: 2
project_name: deep-tutor

before:
  hooks:
    - go mod download

builds:
  - id: deep-tutor
    main: ./cmd/deep-tutor
    binary: deep-tutor
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Inject version identity for `deep-tutor version --verbose/--json` (Integration D/E).
      # buildTimeUTC is the goreleaser run time (UTC), not vcs.time.
      - -s -w -X main.version={{ .Tag }} -X main.gitCommit={{ .ShortCommit }} -X main.buildTimeUTC={{ .Date }} -X deep-tutor/internal/tools/productdocs.linkedVersion={{ .Tag }} -X deep-tutor/internal/tools/productdocs.linkedRevision={{ .Commit }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: deep-tutor
    ids: [deep-tutor]
    name_template: "deep-tutor-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# The release path is GitHub Releases + SHA256SUMS (+ a minisig signature file,
# #50). The upstream Homebrew tap and npm distribution are not this
# repository's to publish to, and the cask block that pointed at
# esengine/homebrew-reasonix would fail a release run rather than help one.
#
# The CLI's own `upgrade` command still resolves the upstream release channel
# (see internal/frontend/cli/upgrade.go); repointing it at this repository's
# releases belongs to the release work, not to the rename.

release:
  prerelease: auto
  make_latest: false
  name_template: "Deep-tutor CLI {{ .Tag }}"
