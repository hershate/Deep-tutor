name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt ruff pytest-cov
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests + coverage
        env:
          AUTH_TOKEN: ci-token
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Contract check (OpenAPI 可导出)
        run: python -c "from app.main import create_app; s = create_app().openapi(); assert s['paths'], 'empty openapi'; print(f\"openapi paths={len(s['paths'])}\")"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check + build
        run: npm run build
