name: CI

on:
  # 用户指定：不每次 commit(push) 都跑。改为仅 PR 触发 + 手动触发
  # （Actions 页 workflow_dispatch）。直接 push 到 main 不再自动跑 CI。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # err.md E4：Windows 矩阵（项目主开发/部署平台为 Windows，路径/换行差异需覆盖）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt ruff pytest-cov
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests + coverage
        env:
          AUTH_TOKEN: ci-token
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Contract check (OpenAPI 可导出)
        # windows-latest 默认 shell 为 pwsh，不识别 bash 风格 \" 转义，
        # 且 f-string 中的 {...} 会被 pwsh 当作 ScriptBlock 解析报错
        # （ScriptBlock should only be specified as a value of the Command parameter）。
        # 显式 shell: bash 使本步骤在 ubuntu/windows 矩阵下命令与引号语义完全一致
        # （windows-latest runner 自带 Git Bash）。
        shell: bash
        run: python -c "from app.main import create_app; s = create_app().openapi(); assert s['paths'], 'empty openapi'; print(f\"openapi paths={len(s['paths'])}\")"

  # ── Go 内核门禁（阶段① M1.5：门禁从 Makefile 搬入 CI）──────────────
  #
  # 两个 Go 模块各测各的：根模块（deep-tutor）与 sdk/go。sdk/go 是嵌套
  # module，根目录的 `go test ./...` 看不见它。旧 Electron 桌面 Go 模块已退役。
  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # .gitattributes 把 *.go 定为 eol=lf，所以 Windows 检出的也是 LF，
      # gofmt 的判断与平台无关——这一条可以在任何一台上跑。
      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd tools sdk desktop)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # 版本钉在 .golangci-version（v2.12.2），与 Makefile 同一个来源；
      # 本地版本不符时 make lint 只警告，CI 必须用钉住的版本。
      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m
      # repolint 是本仓的规约门禁（gofmt/vet/golangci 表达不了的那部分）。
      # 它的扫描域是 git 可见的树，所以在本机与在 CI 上量的是同一棵树。
      - name: repolint
        run: go run ./tools/repolint

  go-test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Linux 侧的沙箱后端要 bubblewrap。装不上时不能红整个 job：
      # 后端不可用的用例会按 fail-closed 走，缺后端是已知状态。
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap || echo "::warning::bubblewrap is unavailable; the sandbox backend tests will run fail-closed"
      - name: build
        run: go build ./...
      # 每一条在 Windows 上跑的根模块 `go test` 都带 -count=1：
      # 开着结果缓存时，go test 会把测试二进制在模块外碰过的每个路径记录下来，
      # 运行前后各做一次 filepath.EvalSymlinks；internal/assembly/boot 记了
      # 约 190 万条，在 Windows runner 上光这一步就要几分钟且什么都不打印。
      # internal/base/testenv 的 TestWindowsCILegsBypassTheTestResultCache
      # 就是守这一条形状的。
      #
      # 单包超时 30m：internal/assembly/boot 在本机要 975–1340 秒（16–22 分），
      # 超过 Go 默认的 600 秒上限，`go test ./...` 一次性跑必然 timeout panic。
      # -p 4 把并发压在 runner 的核数上：本机满并发跑时，一批与负载/时序敏感的
      # 用例会假失败（逐包串行复跑全绿）。
      #
      # 这一步跑在 tools/canary 下：它把整个套件指向一个一次性 home，跑完检查
      # 那个 home 是不是还是空的。测试写进用户自己的 home 是静默的——它先毁了
      # 机器上的 config.toml，用户下一次启动才发现。静态形状门禁抓不到这一类，
      # 因为写文件的包并不提任何 home 变量，它只是调了一个解析 home 的路径函数。
      - name: test (root module)
        timeout-minutes: 75
        env:
          # 跑提示词缓存前缀稳定性守卫（TestCacheHit*）：那里的回归会悄悄
          # 把本项目赖以成立的缓存命中率打下去。
          DEEPTUTOR_RELEASE_CACHE_GUARD: "1"
        run: go run ./tools/canary run -- ./... -count=1 -p 4 -timeout 30m
      - name: test (sdk module)
        working-directory: sdk/go
        timeout-minutes: 20
        run: go test ./... -count=1 -p 4 -timeout 10m

  # 唯一用户界面：REF 来源的 React/Vite 界面 + Tauri 2 Rust 壳。
  tauri-app:
    name: Tauri 2 application
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: TypeScript + Vite build
        run: npm run build
      - name: Tauri environment
        run: npm run tauri info
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: deep-tutor-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
