name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-app:
    name: Tauri 2 application
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # 工具链钉住：与 rust-toolchain.toml 一致，避免 stable rustfmt 规则漂移
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        run: npm ci
      # 49#8：TS 类型错误先于数十分钟的 Rust 测试暴露，反馈周期不再被拖长。
      # 79#8：只跑 tsc 类型检查——完整前端构建由下方 tauri build 的
      # beforeBuildCommand 执行，不再每条 CI 双跑 vite 产物
      - name: Frontend type check
        run: npx tsc --noEmit
      - name: Rust format
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Native backend tests
        working-directory: desktop/src-tauri
        # 串行执行：多个测试共享进程级全局（如 sync DEFER 标志），并行会互相污染
        run: cargo test --release --locked -- --test-threads=1
      - name: Check versions
        # 15#9/C-1：版本一致性检查进 CI，PR 路径不再只靠本地 make lint
        run: node ../scripts/check-versions.mjs
      # 许可收集由 beforeBuildCommand（npm run build:bundle，49#1）执行，
      # 与本地 make build / README 的 npm run tauri build 同一链路
      - name: Build NSIS installer
        run: npm run tauri build -- -- --locked
      # 79#5：安装包层验收——产出的 exe 实际执行 --verify-native 契约
      # （绝对目录强制/绕过单实例/自检 exit 0），打包配置或资源缺失类
      # 回归不再只能靠人工装包发现
      - name: Verify native contract
        working-directory: desktop/src-tauri
        env:
          DEEPTUTOR_VERIFY_DATA_DIR: ${{ runner.temp }}\deeptutor-verify
        run: ./target/release/deep-tutor-workspace.exe --verify-native
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: deep-tutor-windows-nsis
          # 79#1：.sha256 摘要随安装包上传，接收方可校验完整性
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
