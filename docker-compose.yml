# Deep-tutor 部署（plan/09-audit.md §十九）。
# services: backend(uvicorn) + frontend(nginx)。仅 frontend 暴露端口；backend 内部网络。
# .env 不入镜像/仓库；data 卷持久化；skills 以只读 bind mount（vendor 进仓库）。

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # 容器内用绝对路径，挂载点对应 volumes
      DATA_DIR: /data
      SKILLS_DIR: /skills
      DB_PATH: /data/deep-tutor.db
      # P4 多用户：JWT 签名密钥必须固定，否则每次重启全员登录态失效。
      # 在 .env 配置（生成：python -c "import secrets; print(secrets.token_hex(32))"）。
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET（多用户登录必需；如确为单用户 token 模式，删除本行）}
    volumes:
      - deep-tutor-data:/data
      - ./skills:/skills:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  deep-tutor-data:
