[package]
name = "deep-tutor-workspace"
version = "1.0.2"
description = "知舟 Deep Tutor desktop workspace"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
sha2 = "0.10.9"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", features = ["encoding"] }
lopdf = { version = "0.35", default-features = false, features = ["nom_parser"] }
tauri-plugin-dialog = { version = "2.8.4", default-features = false }
keyring = "3.6.3"
zeroize = "1.8.1"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "native-tls"] }
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
