[package]
name = "deep-tutor-workspace"
version = "1.1.15"
description = "知舟 Deep Tutor desktop workspace"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 110#2：tauri 2.12.5 传递引入 reqwest 0.13（无 TLS 后端）与应用钉住的
# 0.12 并存——两套 HTTP 栈同链编译仅体积/编译时长上浮，tauri 内部 fetch
# 被 CSP connect-src ipc: 关闭无运行时风险；跟踪上游归一（需同步
# native-tls feature 决策）。
# 110#3：版本约定为 ^ 语义（patch 号写出≠钉住），实际钉住由 Cargo.lock +
# --locked 门禁承担；行为敏感项（tauri/rusqlite/reqwest）升 minor 走完整
# make check 审查
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
sha2 = "0.10.9"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", features = ["encoding"] }
lopdf = { version = "0.35", default-features = false, features = ["nom_parser"] }
tauri-plugin-dialog = { version = "2.8.4", default-features = false }
tauri-plugin-opener = { version = "2.7.2", default-features = false }
keyring = { version = "3.6.3", features = ["windows-native"] }
zeroize = "1.8.1"
# 154#5：gzip 解压——个别站点/CDN 无条件返回压缩响应，未启用时以
# 压缩字节直读并经 GB18030 兜底解出静默乱码正文
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
# 94#3：网页导入非 UTF-8 中文编码（GBK/GB18030）解码；已在依赖树（reqwest 传递），零新增
encoding_rs = "0.8"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

# 79#9：默认 profile 带完整符号外发——strip 摘除调试符号（逆向面收窄、
# 安装包变小），thin LTO 兼顾链接时优化与构建时长
[profile.release]
strip = true
lto = "thin"
