[package]
name = "deep-tutor-workspace"
version = "1.1.4"
description = "知舟 Deep Tutor desktop workspace"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
sha2 = "0.10.9"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", features = ["encoding"] }
lopdf = { version = "0.35", default-features = false, features = ["nom_parser"] }
tauri-plugin-dialog = { version = "2.8.4", default-features = false }
tauri-plugin-opener = { version = "2.7.2", default-features = false }
keyring = { version = "3.6.3", features = ["windows-native"] }
zeroize = "1.8.1"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "native-tls"] }
# 94#3：网页导入非 UTF-8 中文编码（GBK/GB18030）解码；已在依赖树（reqwest 传递），零新增
encoding_rs = "0.8"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

# 79#9：默认 profile 带完整符号外发——strip 摘除调试符号（逆向面收窄、
# 安装包变小），thin LTO 兼顾链接时优化与构建时长
[profile.release]
strip = true
lto = "thin"
